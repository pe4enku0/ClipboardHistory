name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh --no-install
      - run: ditto -c -k --keepParent build/ClipboardHistory.app ClipboardHistory-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardHistory-macos
          path: ClipboardHistory-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipboardHistory-macos
      - uses: softprops/action-gh-release@v2
        with:
          files: ClipboardHistory-macos.zip
          generate_release_notes: true
